[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultimate-rag"
version = "0.1.0"
description = "Modular, open-source-first, locally-runnable Document Intelligence + Advanced RAG platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ultimate RAG" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "aiosqlite>=0.20",
    "pydantic[email]>=2.6",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0",
    "python-jose[cryptography]>=3.3",
    "passlib>=1.7.4",
    "ulid-py>=1.0",
    "email-validator>=2.1",
    "pymupdf>=1.24",
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "pytesseract>=0.3",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "qdrant-client>=1.9",
    "redis>=5.0",
    "rq>=2.0",
]

[project.optional-dependencies]
transformers-llm = ["transformers>=4.40", "torch>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]
prod = [
    "psycopg[binary]>=3.2",
    "uvicorn>=0.29",
]

[project.scripts]
ultimate-rag-api = "ultimate_rag.main:app"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 108
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
[tool.ruff.lint.isort]
known-first-party = ["ultimate_rag"]

[tool.pytest.ini_options]
testpaths = ["backend/ultimate_rag/tests", "backend/tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
