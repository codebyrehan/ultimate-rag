[project]
name = "ultimate-rag"
version = "0.1.0"
description = "Production-oriented Document Intelligence and RAG platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "aiosqlite>=0.20",
  "psycopg[binary]>=3.1",
  "python-multipart>=0.0.9",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "email-validator>=2.1",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "pypdf>=4.0",
  "pdfplumber>=0.11",
  "pytesseract>=0.3.10",
  "sentence-transformers>=3.0",
  "qdrant-client>=1.10",
  "redis>=5.0",
  "rq>=1.16",
]

[project.scripts]
ultimate-rag-api = "ultimate_rag.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 108
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
[tool.ruff.lint.isort]
known-first-party = ["ultimate_rag"]

[tool.pytest.ini_options]
testpaths = ["backend/ultimate_rag/tests", "backend/tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
