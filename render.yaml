services:
  - type: web
    name: ultimate-rag-api
    runtime: docker
    plan: free
    branch: main
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: stub
      - key: EMBEDDING_PROVIDER
        value: local
      - key: VECTOR_STORE_PROVIDER
        value: in_memory
      - key: RERANKER_PROVIDER
        value: stub
      - key: INLINE_WORKER
        value: "1"
      - key: CACHE_ENABLED
        value: "false"
      - key: CLAIM_EXTRACTION_ENABLED
        value: "false"
      - key: FAITHFULNESS_CHECK_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json
